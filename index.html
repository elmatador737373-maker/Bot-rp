<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Evren City OS - AI Biometric Engine</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 50px;">

    <h2 id="status">Inizializzazione motore biometrico...</h2>
    <div id="result" style="display:none;"></div>

    <script>
        async function start() {
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');

            try {
                statusEl.innerText = "Caricamento modelli IA...";
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
                
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                // Legge i dati passati via URL dalla POST/GET del bot
                const urlParams = new URLSearchParams(window.location.search);
                const fotoUrl = urlParams.get('url');

                if (!fotoUrl) {
                    statusEl.innerText = "⚠️ Motore pronto.";
                    return;
                }

                statusEl.innerText = "Analisi del volto in corso...";
                const queryImage = await faceapi.fetchImage(fotoUrl);
                const queryDetection = await faceapi.detectSingleFace(queryImage).withFaceLandmarks().withFaceDescriptor();

                if (!queryDetection) {
                    resultEl.innerText = JSON.stringify({ status: "not_found" });
                    statusEl.innerText = "❌ Nessun volto rilevato.";
                    return;
                }

                // Restituisce il descrittore biometrico calcolato al bot Discord
                resultEl.innerText = JSON.stringify({
                    status: "success",
                    descriptor: Array.from(queryDetection.descriptor)
                });
                statusEl.innerText = "✅ Elaborazione completata!";

            } catch (err) {
                statusEl.innerText = "❌ Errore: " + err.message;
                resultEl.innerText = JSON.stringify({ status: "error", message: err.toString() });
            }
        }

        start();
    </script>
</body>
</html>
