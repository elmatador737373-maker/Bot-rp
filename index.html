<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discord Webhook Manager - Evren City</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #313338;
            --bg-secondary: #2b2d31;
            --bg-tertiary: #1e1f22;
            --brand-color: #5865f2;
            --brand-color-hover: #4752c4;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --text-header: #f2f3f5;
            --border-radius: 12px;
            --danger: #da373c;
            --success: #23a55a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-tertiary);
            color: var(--text-normal);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* App Bar Superiore per Mobile */
        .app-header {
            background-color: var(--bg-secondary);
            padding: 16px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .app-header h1 {
            font-size: 1.1rem;
            color: var(--text-header);
            font-weight: 700;
        }

        /* Main Container */
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* Layout Desktop / Tablet */
        @media (min-width: 900px) {
            body {
                flex-direction: row;
            }

            .sidebar {
                width: 320px;
                min-width: 320px;
                height: 100vh;
                position: sticky;
                top: 0;
            }

            .container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                padding: 30px;
            }

            .app-header {
                display: none;
            }
        }

        /* Sidebar per la gestione dei Webhook */
        .sidebar {
            background-color: var(--bg-secondary);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-radius: var(--border-radius);
        }

        .sidebar h2 {
            color: var(--text-header);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .saved-webhooks {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }

        .webhook-card {
            background-color: var(--bg-primary);
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .webhook-card:active {
            scale: 0.98;
            background-color: #404249;
        }

        .webhook-info {
            overflow: hidden;
        }

        .webhook-name {
            font-weight: 600;
            color: var(--text-header);
            font-size: 0.95rem;
        }

        .webhook-url-preview {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Pannelli Generali */
        .panel {
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: var(--border-radius);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel h3 {
            color: var(--text-header);
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input, textarea {
            background-color: var(--bg-tertiary);
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text-header);
            font-size: 1rem;
            outline: none;
            width: 100%;
        }

        input:focus, textarea:focus {
            border-color: var(--brand-color);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="color"] {
            padding: 0;
            width: 48px;
            height: 48px;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            background: none;
        }

        button {
            background-color: var(--brand-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        button:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        button.danger-btn {
            background-color: var(--danger);
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
        }

        button.secondary-btn {
            background-color: #4e5058;
            font-size: 0.9rem;
            padding: 10px 16px;
        }

        /* Sezione Bottoni Links */
        .buttons-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .button-row {
            display: flex;
            gap: 8px;
            align-items: center;
            background-color: var(--bg-tertiary);
            padding: 8px;
            border-radius: 8px;
        }

        .button-row input {
            padding: 8px;
            font-size: 0.9rem;
        }

        /* Preview stile Discord */
        .preview-container {
            background-color: var(--bg-primary);
            padding: 14px;
            border-radius: 8px;
        }

        .discord-message {
            display: flex;
            gap: 12px;
        }

        .discord-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--brand-color);
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .discord-content {
            flex-grow: 1;
            overflow: hidden;
        }

        .discord-author {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .author-name {
            font-weight: 600;
            color: var(--text-header);
            font-size: 0.9rem;
        }

        .bot-tag {
            background-color: var(--brand-color);
            color: white;
            font-size: 0.6rem;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        .discord-embed {
            border-left: 4px solid var(--brand-color);
            background-color: var(--bg-secondary);
            padding: 10px 12px;
            border-radius: 4px;
            margin-top: 6px;
        }

        .embed-title {
            font-weight: 700;
            color: var(--text-header);
            font-size: 0.95rem;
            margin-bottom: 6px;
        }

        .embed-description {
            font-size: 0.85rem;
            white-space: pre-line;
            color: var(--text-normal);
            word-break: break-word;
        }

        .embed-footer {
            margin-top: 8px;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .discord-buttons-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .discord-btn-preview {
            background-color: #4e5058;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>⚙️ Webhook Manager - Evren City</h1>
    </div>

    <div class="sidebar">
        <h2>📌 Webhook Salvati</h2>
        
        <div class="form-group">
            <input type="text" id="new-webhook-name" placeholder="Nome Webhook">
            <input type="url" id="new-webhook-url" placeholder="URL Webhook Discord">
            <button onclick="saveWebhook()">+ Salva Nuovo Webhook</button>
        </div>

        <div class="saved-webhooks" id="webhook-list"></div>
    </div>

    <div class="container">
        
        <div class="panel">
            <h3>📝 Personalizza Messaggio</h3>

            <div class="form-group">
                <label>URL Webhook Discord Destination</label>
                <input type="url" id="target-webhook-url" value="https://discord.com/api/webhooks/1533164184299114606/sjRPIh-IPuFTwOGXGhbNHeij-ixpi5dI9PegE8SaniJRbXqlQo9WLw2xV6YOJLyRr16x">
            </div>

            <div class="form-group">
                <label>Nome Bot / Mittente</label>
                <input type="text" id="bot-name" value="Evren City - System Info" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>Avatar URL (Icona Bot)</label>
                <input type="url" id="bot-avatar" placeholder="https://..." oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>Titolo Embed</label>
                <input type="text" id="embed-title" value="📜 TUTTI I REGOLAMENTI DI EVREN CITY 2026" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>Descrizione / Benvenuto</label>
                <textarea id="embed-desc" oninput="updatePreview()">Benvenuto su Evren City! Per consultare i regolamenti ufficiali del server, clicca sui bottoni qui sotto per aprire direttamente i documenti.</textarea>
            </div>

            <div class="form-group">
                <label>Colore Bordo Embed</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="embed-color" value="#5865f2" oninput="updatePreview()">
                    <span id="color-hex" style="font-weight: 600;">#5865f2</span>
                </div>
            </div>

            <div class="form-group">
                <label>Testo Footer (In basso)</label>
                <input type="text" id="embed-footer" value="Evren City Roleplay • Tutti i diritti riservati" oninput="updatePreview()">
            </div>

            <div class="form-group">
                <label>🔗 Bottoni Link Nativi</label>
                <div class="buttons-list" id="buttons-container"></div>
                <button type="button" class="secondary-btn" onclick="addButtonInput()">+ Aggiungi Bottone Link</button>
            </div>

            <button onclick="sendWebhookMessage()" style="font-size: 1.1rem; padding: 16px; margin-top: 10px;">🚀 Invia Webhook con Bottoni Nativi</button>
        </div>

        <div class="panel">
            <h3>👁️ Anteprima Live Discord</h3>

            <div class="preview-container">
                <div class="discord-message">
                    <div class="discord-avatar" id="pv-avatar"></div>
                    <div class="discord-content">
                        <div class="discord-author">
                            <span class="author-name" id="pv-author">Evren City - System Info</span>
                            <span class="bot-tag">BOT</span>
                        </div>

                        <div class="discord-embed" id="pv-embed">
                            <div class="embed-title" id="pv-title">📜 TUTTI I REGOLAMENTI DI EVREN CITY</div>
                            <div class="embed-description" id="pv-desc">Benvenuto nel server!</div>
                            <div class="embed-footer" id="pv-footer">Evren City Roleplay</div>
                        </div>

                        <div class="discord-buttons-preview" id="pv-buttons"></div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const defaultEvrenPreset = {
            id: 'evren-default-001',
            name: '⭐ Evren City Regolamenti (Default)',
            url: 'https://discord.com/api/webhooks/1533164184299114606/sjRPIh-IPuFTwOGXGhbNHeij-ixpi5dI9PegE8SaniJRbXqlQo9WLw2xV6YOJLyRr16x'
        };

        // 🔗 LINK AGGIORNATI CON LE TUE URL
        const defaultButtons = [
            { label: '📜 Criminalità 2026', url: 'https://docs.google.com/document/d/1-OlPcuRHTGE_V8MBkCxDzDcSgU3OsJqdB3bT1yS4biA/edit?usp=drivesdk' },
            { label: '🚨 Rapine Camion', url: 'https://docs.google.com/document/d/14aSlHExowuo6Kr2ln3cyHGuNp4Sd-Pwj0JQfofLoC9c/edit?usp=drivesdk' },
            { label: '⚔️ Traffico d\'Armi', url: 'https://docs.google.com/document/d/13DjkTIq1UUrgi_FYwwGR8Z2m4MrEmo31OEtBAM3-UTk/edit?usp=drivesdk' },
            { label: '👔 Merci Contraffatte', url: 'https://docs.google.com/document/d/1-U1CNWkJlw1YTWRvEHujbp7zL7-slAIFczD-WPysSXs/edit?usp=drivesdk' },
            { label: '🚘 Magazzini', url: 'https://docs.google.com/document/d/12XrcZbAsoBlC1mUIFfDdCyPTsW-w-NRJCGXKrbalJoc/edit?usp=drivesdk' },
            { label: '🌿 Spaccio Personale', url: 'https://docs.google.com/document/d/1-oO5Rf_pVrCjOo0Yrh4jFEDwBhuYMEl2p4iaC37cNes/edit?usp=drivesdk' },
            { label: '💊 Traffico', url: 'https://docs.google.com/document/d/1-YkZoKUxS_qE8xqriGmSqBhz22_UdyhiRzHMds6T8zM/edit?usp=drivesdk' },
            { label: '🎲 Casinò Clandestini', url: 'https://docs.google.com/document/d/1QZp6zM_21OHXzAKOiFCGokV-7RvDe-IKkaEvRYYsUhY/edit?usp=drivesdk' },
            { label: '💰 Soldi Sporchi', url: 'https://docs.google.com/document/d/1HvBxGjLZAhzjEVG9mtxdEZYS4emC9_cuTU35_IRBzBE/edit?usp=drivesdk' },
            { label: '📄 Documenti Falsi', url: 'https://docs.google.com/document/d/1-7dbNYMjpdzdVsH4hbLFJuooKcN3rZnX4MMnivSNASo/edit?usp=drivesdk' },
            { label: '💵 Soldi Falsi', url: 'https://docs.google.com/document/d/11L6JaSd7g6Sb7ANIwSlEA9lJxDyWsskAZu6W6D4pYPc/edit?usp=drivesdk' },
            { label: '📊 Tasse', url: 'https://docs.google.com/document/d/11ivjpwCazRJB2BhNtAkCEz8JhDF_9cKuPvRpk_dDIsg/edit?usp=drivesdk' }
        ];

        let savedWebhooks = JSON.parse(localStorage.getItem('evren_webhooks')) || [];
        
        if (!savedWebhooks.some(w => w.id === defaultEvrenPreset.id)) {
            savedWebhooks.unshift(defaultEvrenPreset);
        }

        let linkButtons = [...defaultButtons];

        window.onload = () => {
            renderWebhooks();
            renderButtonsInputs();
            updatePreview();
        };

        function saveWebhook() {
            const name = document.getElementById('new-webhook-name').value.trim();
            const url = document.getElementById('new-webhook-url').value.trim();

            if (!name || !url) return alert('Inserisci sia un nome che un URL!');

            savedWebhooks.push({ id: 'wh-' + Date.now(), name, url });
            localStorage.setItem('evren_webhooks', JSON.stringify(savedWebhooks));
            
            document.getElementById('new-webhook-name').value = '';
            document.getElementById('new-webhook-url').value = '';
            
            renderWebhooks();
        }

        function deleteWebhook(id, event) {
            event.stopPropagation();
            savedWebhooks = savedWebhooks.filter(w => w.id !== id);
            localStorage.setItem('evren_webhooks', JSON.stringify(savedWebhooks));
            renderWebhooks();
        }

        function selectWebhook(url) {
            if(url) {
                document.getElementById('target-webhook-url').value = url;
            }
        }

        function renderWebhooks() {
            const list = document.getElementById('webhook-list');
            list.innerHTML = '';
            savedWebhooks.forEach(w => {
                const card = document.createElement('div');
                card.className = 'webhook-card';
                card.onclick = () => selectWebhook(w.url);
                card.innerHTML = `
                    <div class="webhook-info">
                        <div class="webhook-name">${w.name}</div>
                        <div class="webhook-url-preview">${w.url || 'Incolla il tuo URL'}</div>
                    </div>
                    ${w.id !== defaultEvrenPreset.id ? `<button class="danger-btn" onclick="deleteWebhook('${w.id}', event)">X</button>` : ''}
                `;
                list.appendChild(card);
            });
        }

        function renderButtonsInputs() {
            const container = document.getElementById('buttons-container');
            container.innerHTML = '';

            linkButtons.forEach((btn, index) => {
                const row = document.createElement('div');
                row.className = 'button-row';
                row.innerHTML = `
                    <input type="text" placeholder="Nome" value="${btn.label}" oninput="updateButtonData(${index}, 'label', this.value)">
                    <input type="url" placeholder="URL" value="${btn.url}" oninput="updateButtonData(${index}, 'url', this.value)">
                    <button type="button" class="danger-btn" onclick="removeButton(${index})">X</button>
                `;
                container.appendChild(row);
            });
            updatePreview();
        }

        function addButtonInput() {
            linkButtons.push({ label: 'Nuovo Link', url: 'https://google.com' });
            renderButtonsInputs();
        }

        function updateButtonData(index, field, value) {
            linkButtons[index][field] = value;
            updatePreview();
        }

        function removeButton(index) {
            linkButtons.splice(index, 1);
            renderButtonsInputs();
        }

        function updatePreview() {
            const botName = document.getElementById('bot-name').value || 'Bot Discord';
            const botAvatar = document.getElementById('bot-avatar').value || 'https://cdn.discordapp.com/embed/avatars/0.png';
            const title = document.getElementById('embed-title').value;
            const desc = document.getElementById('embed-desc').value;
            const color = document.getElementById('embed-color').value;
            const footer = document.getElementById('embed-footer').value;

            document.getElementById('pv-author').innerText = botName;
            document.getElementById('pv-avatar').style.backgroundImage = `url('${botAvatar}')`;
            document.getElementById('pv-title').innerText = title;
            document.getElementById('pv-desc').innerText = desc;
            document.getElementById('pv-footer').innerText = footer;
            document.getElementById('pv-embed').style.borderColor = color;
            document.getElementById('color-hex').innerText = color;

            const btnPreviewContainer = document.getElementById('pv-buttons');
            btnPreviewContainer.innerHTML = '';
            linkButtons.forEach(b => {
                if (b.label) {
                    const btnEl = document.createElement('div');
                    btnEl.className = 'discord-btn-preview';
                    btnEl.innerHTML = `↗️ ${b.label}`;
                    btnPreviewContainer.appendChild(btnEl);
                }
            });
        }

        async function sendWebhookMessage() {
            let webhookUrl = document.getElementById('target-webhook-url').value.trim();
            if (!webhookUrl) return alert('Incolla l\'URL del tuo Webhook prima di inviare!');

            // Assicura che l'URL contenga il parametro per attivare i bottoni
            if (!webhookUrl.includes('with_components=true')) {
                webhookUrl += (webhookUrl.includes('?') ? '&' : '?') + 'with_components=true';
            }

            const botName = document.getElementById('bot-name').value;
            const botAvatar = document.getElementById('bot-avatar').value;
            const title = document.getElementById('embed-title').value;
            const desc = document.getElementById('embed-desc').value;
            const colorHex = document.getElementById('embed-color').value;
            const colorInt = parseInt(colorHex.replace('#', ''), 16);
            const footer = document.getElementById('embed-footer').value;

            // Raggruppa i bottoni in Action Rows (massimo 4 bottoni per riga)
            const validButtons = linkButtons.filter(b => b.label && b.url);
            const actionRows = [];
            const chunkSize = 4;

            for (let i = 0; i < validButtons.length; i += chunkSize) {
                const chunk = validButtons.slice(i, i + chunkSize);
                actionRows.push({
                    type: 1, // Action Row
                    components: chunk.map(b => ({
                        type: 2,        // Button Component
                        style: 5,       // Link Button Style
                        label: b.label,
                        url: b.url
                    }))
                });
            }

            const payload = {
                username: botName,
                avatar_url: botAvatar,
                embeds: [
                    {
                        title: title,
                        description: desc,
                        color: colorInt,
                        footer: { text: footer },
                        timestamp: new Date().toISOString()
                    }
                ],
                components: actionRows
            };

            try {
                const response = await fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok || response.status === 204) {
                    alert('✅ Messaggio inviato con successo con tutti i Bottoni Nativi!');
                } else {
                    const errorMsg = await response.text();
                    alert(`❌ Errore Discord (${response.status}): ${errorMsg}`);
                }
            } catch (err) {
                console.error(err);
                alert('❌ Errore di connessione o URL Webhook non valido.');
            }
        }
    </script>
</body>
</html>
