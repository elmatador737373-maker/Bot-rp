<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Evren City OS - AI Biometric Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 50px;">

    <h2 id="status">Inizializzazione motore biometrico...</h2>
    <div id="result" style="display:none;"></div>

    <script>
        // Configurazione Supabase tramite variabili d'ambiente o placeholder
        // Ricordati di impostare NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_KEY nelle impostazioni di Vercel
        const SUPABASE_URL = window.ENV?.SUPABASE_URL || "INSERISCI_URL_QUI";
        const SUPABASE_KEY = window.ENV?.SUPABASE_KEY || "INSERISCI_KEY_QUI";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function start() {
            const statusEl = document.getElementById('status');
            const resultEl = document.getElementById('result');

            try {
                let tentativi = 0;
                while (typeof faceapi === 'undefined') {
                    if (tentativi > 50) throw new Error("Libreria faceapi non caricata.");
                    await new Promise(resolve => setTimeout(resolve, 100));
                    tentativi++;
                }

                statusEl.innerText = "Caricamento modelli IA...";
                const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
                
                await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);

                const urlParams = new URLSearchParams(window.location.search);
                const fotoUrl = urlParams.get('url');

                if (!fotoUrl) {
                    statusEl.innerText = "⚠️ Motore pronto.";
                    return;
                }

                statusEl.innerText = "Analisi del volto in corso...";
                const queryImage = await faceapi.fetchImage(fotoUrl);
                const queryDetection = await faceapi.detectSingleFace(queryImage).withFaceLandmarks().withFaceDescriptor();

                if (!queryDetection) {
                    resultEl.innerText = JSON.stringify({ status: "not_found" });
                    statusEl.innerText = "❌ Nessun volto rilevato.";
                    return;
                }

                statusEl.innerText = "Confronto con il database centrale...";
                
                const { data: documenti, error } = await supabaseClient.from('documents').select('*');
                
                if (error || !documenti || documenti.length === 0) {
                    throw new Error("Impossibile accedere al database o nessun documento trovato.");
                }

                let bestMatch = null;
                let minDistance = 0.6; // Soglia di tolleranza biometrica

                for (let doc of documenti) {
                    if (doc.descriptor) {
                        const dbDescriptor = new Float32Array(doc.descriptor);
                        const distance = faceapi.euclideanDistance(queryDetection.descriptor, dbDescriptor);
                        
                        if (distance < minDistance) {
                            minDistance = distance;
                            bestMatch = doc;
                        }
                    }
                }

                if (bestMatch) {
                    resultEl.innerText = JSON.stringify({
                        status: "success",
                        match: bestMatch,
                        distance: minDistance
                    });
                    statusEl.innerText = "✅ Cittadino identificato!";
                } else {
                    resultEl.innerText = JSON.stringify({ status: "not_matched" });
                    statusEl.innerText = "❌ Nessun riscontro nel database.";
                }

            } catch (err) {
                statusEl.innerText = "❌ Errore: " + err.message;
                resultEl.innerText = JSON.stringify({ status: "error", message: err.toString() });
            }
        }

        window.onload = start;
    </script>
</body>
</html>
